<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Order</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav id="mainNav"></nav>

    <h1>Place Your Order</h1>

    <div class="orderCard">

        <h2 id="selectedFood">Food</h2>

        <p id="foodPrice"></p>

        <label>Quantity:</label>

        <input
            type="number"
            id="quantity"
            value="1"
            min="1"
            oninput="calculateTotal()"
        >

        <p>
            Total: $<span id="total">0</span>
        </p>

        <button
            type="button"
            onclick="sendOrder()"
        >
            Confirm Order
        </button>

        <a href="menu.html">
            <button type="button">
                Back to Menu
            </button>
        </a>

    </div>

    <script src="script.js"></script>

</body>

</html>
