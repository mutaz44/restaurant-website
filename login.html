<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="signupPage">

    <h1>Welcome Back</h1>

    <div class="signupCard">
        <p id="loginError" class="errorMessage"></p>

        <input
            type="text"
            id="loginPhone"
            placeholder="Your Phone"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button
            type="button"
            onclick="loginAccount()"
        >
            Login
        </button>

        <a href="signup.html">
            <button type="button">
                Create New Account
            </button>
        </a>

        <a href="index.html">
            <button type="button">
                Back to Home
            </button>
        </a>

    </div>

    <script src="script.js"></script>

</body>

</html>
